[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==2.13.6"]
build-backend = "scikit_build_core.build"

[project]
name = "optitrain-kvtransfer"
version = "0.1.0"
description = "Bounded C++ TCP KV-cache transfer engine"
requires-python = ">=3.10"

[project.optional-dependencies]
vllm = ["vllm==0.10.1"]
test = ["pytest>=8,<9"]

[tool.scikit-build]
wheel.packages = ["python/kvtransfer"]
cmake.args = ["-DKVT_PYTHON=ON", "-DBUILD_TESTING=OFF"]

[tool.ruff]
extend = "../pyproject.toml"
